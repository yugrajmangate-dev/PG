<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyGuard AI Protector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --btn-grad: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 16px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
      background: rgba(34, 197, 94, 0.1);
      padding: 4px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(34, 197, 94, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .hero-stat {
      text-align: center;
      padding: 10px 0;
    }

    .hero-stat .stat-num {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent-blue);
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      line-height: 1;
      margin-bottom: 8px;
    }

    .hero-stat .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .stats-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .stat-row .label {
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-row .value {
      font-weight: 700;
      font-size: 14px;
    }

    .val-red { color: var(--accent-red); }
    .val-orange { color: var(--accent-orange); }
    .val-purple { color: var(--accent-purple); }
    .val-yellow { color: #f59e0b; }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 8px 0;
    }

    .primary-btn {
      width: 100%;
      background: var(--btn-grad);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .primary-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="glass-panel">
    <div class="header">
      <span class="header-title">PrivacyGuard AI</span>
      <span class="status-badge">ACTIVE</span>
    </div>

    <div class="hero-stat">
      <div class="stat-num" id="leakCount">0</div>
      <div class="stat-label">Data Leaks Blocked</div>
    </div>
  </div>

  <div class="glass-panel stats-grid">
    <div class="stat-row">
      <span class="label">API Keys Blocked</span>
      <span class="value val-red" id="api-keys-blocked">0</span>
    </div>
    <div class="divider"></div>
    <div class="stat-row">
      <span class="label">PII (Emails) Blocked</span>
      <span class="value val-orange" id="pii-blocked">0</span>
    </div>
  </div>

  <div class="glass-panel stats-grid">
    <div class="stat-row">
      <span class="label">Security Rank</span>
      <span class="value val-purple" id="guard-rank">Guardian</span>
    </div>
    <div class="divider"></div>
    <div class="stat-row">
      <span class="label">Protection Level</span>
      <span class="value val-yellow">Zero-Trust</span>
    </div>
    <div class="divider"></div>
    <div class="stat-row">
      <span class="label">PDF Scan</span>
      <span class="value val-orange" id="pdf-scan-status">Enabled</span>
    </div>
  </div>

  <div class="glass-panel">
    <div style="font-weight:700;margin-bottom:8px">ML Demo — PII Classifier</div>
    <textarea id="mlInput" placeholder="Paste or type text to scan for PII" style="width:100%;height:90px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text-main);resize:vertical"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="primary-btn" id="classifyBtn" style="flex:1;padding:8px">Classify Text</button>
      <button class="primary-btn" id="redactBtn" style="flex:1;padding:8px">Redact PII</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="ocrFile" type="file" accept="image/*" style="display:none" />
      <button class="primary-btn" id="ocrBtn" style="flex:1;padding:8px">OCR Image</button>
    </div>
    <div id="mlResult" style="margin-top:10px;color:var(--text-muted);font-size:13px;white-space:pre-wrap"></div>
  </div>

  <button class="primary-btn" id="viewLogs">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
      <polyline points="10 9 9 9 8 9"></polyline>
    </svg>
    View Detailed Logs
  </button>

  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="ml/js_inference_example.js"></script>
  <script src="popup_ml.js"></script>
  <script src="popup.js"></script>
</body>
</html>
